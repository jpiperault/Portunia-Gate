# Heimdia, taille « petite » : le bastion et sa base sur un même serveur.
# Installation : ./installer.sh (crée .env, construit, démarre). Voir README.md.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: heimdia
      POSTGRES_USER: heimdia
      POSTGRES_PASSWORD: ${HEIMDIA_DB_PASSWORD:?définissez HEIMDIA_DB_PASSWORD dans .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdia -d heimdia"]
      interval: 5s
      retries: 20

  heimdia:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HEIMDIA_DATABASE_URL: postgres://heimdia:${HEIMDIA_DB_PASSWORD}@postgres/heimdia
      TZ: ${TZ:-Europe/Paris}
      HEIMDIA_SSH_PUBLIC_PORT: ${HEIMDIA_SSH_PORT:-2222}
      # Certificat de l'entreprise (fichiers PEM copiés dans /var/lib/heimdia) ; vide = auto-signé.
      HEIMDIA_TLS_CERT: ${HEIMDIA_TLS_CERT:-}
      HEIMDIA_TLS_KEY: ${HEIMDIA_TLS_KEY:-}
    ports:
      - "${HEIMDIA_SSH_PORT:-2222}:2222"
      - "${HEIMDIA_API_PORT:-8443}:8443"
    volumes:
      - donnees:/var/lib/heimdia

volumes:
  postgres:
  donnees:
