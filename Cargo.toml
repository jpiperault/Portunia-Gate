[package]
name = "heimdia"
version = "0.8.2"
description = "Bastion SSH de Portunia : accès contrôlés, coffre, enregistrement et journal d'audit"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
ironrdp-rdcleanpath = "0.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
qrcode = { version = "0.14", default-features = false }
rcgen = "0.13"
ring = "0.17"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Même moteur SSH que Portunia (ring, sans aws-lc).
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Paquet Debian (cargo deb --target x86_64-unknown-linux-musl) : binaire autonome, valable
# sur Debian 12 et 13 et Ubuntu 22.04 et suivantes. Configuration par installer.sh.
[package.metadata.deb]
maintainer = "Julien Piperault <jpiperault@users.noreply.github.com>"
copyright = "Julien Piperault"
extended-description = """\
Les utilisateurs passent par Heimdia pour atteindre les serveurs : contrôle des accès, \
compte fourni par le coffre, sessions enregistrées et signées, journal d'audit chaîné. \
S'administre depuis Portunia."""
section = "net"
priority = "optional"
depends = "systemd, passwd, util-linux"
recommends = "postgresql"
maintainer-scripts = "debian/"
assets = [
    ["target/release/heimdia", "usr/lib/heimdia/heimdia", "755"],
    ["debian/heimdia.sh", "usr/bin/heimdia", "755"],
    ["debian/heimdia.service", "usr/lib/systemd/system/heimdia.service", "644"],
    ["README.md", "usr/share/doc/heimdia/README.md", "644"],
    ["docs/exploitation.md", "usr/share/doc/heimdia/exploitation.md", "644"],
]

[profile.release]
strip = true
