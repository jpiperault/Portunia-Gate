# Publie une version de Portunia Gate : à chaque tag vX.Y.Z poussé sur GitHub, compile le paquet
# Debian (binaire autonome, musl) et crée la release dans le dépôt PUBLIC
# jpiperault/Portunia-Gate-releases (le code reste privé ici), où installer.sh télécharge
# portunia-gate_amd64.deb et vérifie son empreinte dans SHA256SUMS. Une copie de la release,
# avec la liste des changements, est aussi créée dans ce dépôt.
#
# Secret à définir dans ce dépôt (Settings > Secrets and variables > Actions) :
#   RELEASES_TOKEN   jeton d'accès (fine-grained) avec le droit
#                    « Contents : Read and write » sur Portunia-Gate-releases
name: Publier une version

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # release copiée dans ce dépôt

jobs:
  paquet:
    # Système figé : le compilateur C d'une version plus récente produisait du code AVX
    # (« Illegal instruction » sur les processeurs virtuels kvm64 de Proxmox).
    runs-on: ubuntu-24.04
    env:
      # Jeu d'instructions x86-64 de base, pour le code Rust comme pour le C de ring.
      RUSTFLAGS: -C target-cpu=x86-64
      CFLAGS_x86_64_unknown_linux_musl: -march=x86-64 -mtune=generic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools qemu-user

      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2
        with:
          tool: cargo-deb

      - name: Paquet Debian
        run: |
          cargo deb --target x86_64-unknown-linux-musl

      # Le paquet doit tourner sur un processeur ancien (qemu64 : ni AVX ni SSE4) : on y
      # crée les clés et le certificat comme à l'installation (la base, absente, arrête la suite).
      - name: Essai sur un processeur sans AVX
        run: |
          d=$(mktemp -d)
          PORTUNIA_GATE_DATA_DIR=$d PORTUNIA_GATE_DATABASE_URL=postgres://essai@127.0.0.1:1/essai \
            timeout 120 qemu-x86_64 -cpu qemu64 target/x86_64-unknown-linux-musl/release/portunia-gate init --no-admin || true
          ls -l $d
          test -s $d/signature.key && test -s $d/api.crt

      - name: Fichiers publiés
        run: |
          mkdir publie
          cp target/x86_64-unknown-linux-musl/debian/portunia-gate_*.deb publie/
          # Nom stable pour le lien « dernière version » utilisé par installer.sh.
          cp publie/portunia-gate_*.deb publie/portunia-gate_amd64.deb
          cp installer.sh publie/
          cd publie && sha256sum *.deb installer.sh > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ secrets.RELEASES_TOKEN }}
          repository: jpiperault/Portunia-Gate-releases
          # Le dépôt public ne contient pas ce code : le tag y est créé sur sa branche main.
          target_commitish: main
          tag_name: ${{ github.ref_name }}
          name: Portunia Gate ${{ github.ref_name }}
          body: |
            Install on Debian 12/13 or Ubuntu 22.04 and later:

            ```bash
            curl -fsSLO https://github.com/jpiperault/Portunia-Gate-releases/releases/latest/download/installer.sh
            sudo bash installer.sh
            ```

            Update an installed Gate: `sudo bash installer.sh mise-a-jour`.

            ---

            Installation sur Debian 12/13 ou Ubuntu 22.04 et suivantes : mêmes commandes. Mise à jour : `sudo bash installer.sh mise-a-jour`.
          files: publie/*

      # Copie dans ce dépôt privé, avec la liste des changements depuis la version précédente.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Portunia Gate ${{ github.ref_name }}
          generate_release_notes: true
          files: publie/*
